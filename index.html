<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juan 4:13–14</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: #17352b;

            /* Nature-inspired background */
            background:
                linear-gradient(
                    rgba(235, 245, 235, 0.78),
                    rgba(220, 240, 235, 0.88)
                ),
                linear-gradient(
                    135deg,
                    #b8d8c0 0%,
                    #dcebdc 45%,
                    #b9d9d5 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 20px;
        }

        .page {
            width: 100%;
            max-width: 720px;

            background: rgba(255, 255, 255, 0.88);

            padding: 45px 35px;

            border-radius: 22px;

            box-shadow:
                0 10px 35px rgba(30, 70, 50, 0.18);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h1 {
            margin: 0 0 30px;

            text-align: center;

            font-size: 30px;

            color: #1f503d;

            font-weight: 600;
        }

        .verse {
            font-size: 22px;

            line-height: 1.9;

            text-align: left;

            margin: 0;
        }

        .water {
            text-align: center;

            font-size: 30px;

            margin-bottom: 22px;

            opacity: 0.75;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 14px;
            }

            .page {
                padding: 32px 23px;
                border-radius: 18px;
            }

            h1 {
                font-size: 25px;
                margin-bottom: 24px;
            }

            .verse {
                font-size: 19px;
                line-height: 1.8;
            }

            .water {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="water">💧</div>

        <h1>Juan 4:13–14</h1>

        <p class="verse">
            Si Jesus mitubag, “Ang moinom niining tubiga uhawon pag-usab,
            apan ang moinom sa tubig nga akong ihatag kaniya dili na gayod
            uhawon. Kay ang tubig nga akong ihatag mahimo diha kaniya nga
            usa ka tuboran nga mohatag ug buhing tubig ug kinabuhing walay
            kataposan.”
        </p>

    </main>

</body>
</html>
