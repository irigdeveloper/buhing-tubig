    <style>
        body {
            margin: 0;

            background: white;
            color: black;
            font-family: Arial, sans-serif;
            line-height: 1.8;

        }

        main {
            max-width: 700px;

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }
    </style>

<body>
    <main>
        <h1>Juan 4:13–14</h1>

        <p>
            Si Jesus mitubag, “Ang moinom niining tubiga uhawon pag-usab,
            apan ang moinom sa tubig nga akong ihatag kaniya dili na gayod
            uhawon. Kay ang tubig nga akong ihatag mahimo diha kaniya nga
            usa ka tuboran nga mohatag ug buhing tubig ug kinabuhing walay
            kataposan.”
        </p>
    </main>
